services:
  app:
    image: todo-app
    container_name: golang-todo
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/todo_list
    ports:
      - "8080:8080"
    networks:
      - todo-network

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=todo_list
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 10s
      retries: 20
    networks:
      - todo-network

volumes:
  pgdata:

networks:
  todo-network:
    driver: bridge
